name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify bin scripts are executable
        run: |
          test -f bin/create-tokru-profile.js && echo "✅ create-tokru-profile.js exists"
          test -f bin/tokru.js && echo "✅ tokru.js exists"

      - name: Publish
        run: npm publish --access public --provenance
